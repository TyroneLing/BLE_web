<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ESP32-C3 BLE LED</title>
<style>
  :root { --accent: #0a7cff; --led: 255, 179, 0; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  body { font-family: -apple-system, sans-serif; text-align: center; margin: 4vh 16px; background: #fafafa; color: #222; }
  h1 { font-size: 1.3em; margin: 0 0 .6em; }
  button { font-size: 1.1em; padding: .6em 1.2em; margin: .25em; border: 0; border-radius: 12px; color: #fff; background: var(--accent); }
  button:disabled { background: #bbb; }
  #msg { color: #666; min-height: 1.4em; margin: .4em 0; }

  /* LED 預覽: 用亮度改變光暈 */
  #led { width: 64px; height: 64px; border-radius: 50%; margin: .6em auto; background: #ccc; }

  /* 搖桿 (油門式: 上下控制亮度，放開後停在原位) */
  .stick-wrap { display: flex; align-items: center; justify-content: center; gap: 20px; margin: .8em 0; }
  #pad { position: relative; width: 200px; height: 200px; border-radius: 50%; touch-action: none;
         background: radial-gradient(circle, #fff 0%, #e8ecf2 70%, #d5dbe4 100%);
         box-shadow: inset 0 2px 8px rgba(0,0,0,.15); }
  #pad::before { content: ""; position: absolute; left: 50%; top: 14px; bottom: 14px; width: 4px;
                 margin-left: -2px; border-radius: 2px; background: #c3cad6; }
  #knob { position: absolute; left: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
          background: radial-gradient(circle at 35% 35%, #5aa9ff, var(--accent)); box-shadow: 0 4px 10px rgba(0,0,0,.3); }
  #pad.disabled { opacity: .4; }
  #pct { font-size: 2.2em; font-weight: 600; min-width: 3.2em; font-variant-numeric: tabular-nums; }
  input[type=range] { width: min(320px, 90%); }
  .hint { color: #999; font-size: .85em; }
</style>
</head>
<body>
<h1>ESP32-C3 BLE LED</h1>
<button id="connect">連線藍牙</button>
<div id="msg">尚未連線</div>
<div id="led"></div>

<div class="stick-wrap">
  <div id="pad" class="disabled"><div id="knob"></div></div>
  <div id="pct">--%</div>
</div>
<input id="slider" type="range" min="0" max="100" value="0" disabled>
<div class="hint">上下拖動搖桿或滑桿調整亮度</div>

<div style="margin-top:.8em">
  <button class="cmd" data-v="1" disabled>開</button>
  <button class="cmd" data-v="0" disabled>關</button>
  <button class="cmd" data-v="2" disabled>閃爍</button>
</div>

<script>
// 與韌體 main/ble_led.c 中的 UUID 一致
const SVC    = 'c3e1d000-5a8b-4c2d-9f1e-2b7a3c4d5e60';
const CTRL   = 'c3e1d001-5a8b-4c2d-9f1e-2b7a3c4d5e60';
const STATE  = 'c3e1d002-5a8b-4c2d-9f1e-2b7a3c4d5e60';
const BRIGHT = 'c3e1d003-5a8b-4c2d-9f1e-2b7a3c4d5e60';

const $ = s => document.querySelector(s);
const pad = $('#pad'), knob = $('#knob'), slider = $('#slider'), cmds = document.querySelectorAll('.cmd');
let device, ctrl, bright;
let dragging = false;

/* ---------- UI ---------- */
function setMsg(t) { $('#msg').textContent = t; }

function showLevel(pct) {           // 更新搖桿位置、滑桿、百分比
  const travel = pad.clientHeight - 2 * 32 - 2 * 6;          // 旋鈕可移動的距離
  knob.style.top = (32 + 6 + (1 - pct / 100) * travel) + 'px';
  slider.value = pct;
  $('#pct').textContent = pct + '%';
}

function showLed(on, pct) {         // LED 預覽 (亮度越高光暈越大)
  const a = on ? Math.max(pct, 8) / 100 : 0;
  $('#led').style.background = on ? `rgba(var(--led), ${0.25 + 0.75 * a})` : '#ccc';
  $('#led').style.boxShadow = on ? `0 0 ${8 + 30 * a}px rgba(var(--led), ${a})` : 'none';
}

function setConnected(c) {
  cmds.forEach(b => b.disabled = !c);
  slider.disabled = !c;
  pad.classList.toggle('disabled', !c);
  $('#connect').textContent = c ? '中斷連線' : '連線藍牙';
  if (!c) showLed(false, 0);
}

function onState(dv) {              // [on, blinking, brightness]
  const on = dv.getUint8(0), blinking = dv.getUint8(1);
  const pct = dv.byteLength > 2 ? dv.getUint8(2) : (on ? 100 : 0);
  showLed(on, pct);
  if (!dragging) showLevel(pct);     // 拖動中不被通知覆蓋，避免跳動
  setMsg('已連線 · ' + (blinking ? '閃爍中' : (pct ? `亮度 ${pct}%` : '關')));
}

/* ---------- BLE 寫入 (排隊 + 亮度合併，避免 "GATT operation already in progress") ---------- */
let gattChain = Promise.resolve();
function gatt(fn) { gattChain = gattChain.then(fn).catch(e => setMsg('寫入失敗: ' + e.message)); return gattChain; }

let pendingLevel = null, levelBusy = false;
function sendLevel(pct) {
  pendingLevel = pct;
  if (levelBusy) return;             // 傳送中: 只保留最新值，傳完再送
  levelBusy = true;
  const pump = () => {
    if (pendingLevel === null) { levelBusy = false; return; }
    const v = new Uint8Array([pendingLevel]);
    pendingLevel = null;
    gatt(() => bright.writeValueWithoutResponse ? bright.writeValueWithoutResponse(v) : bright.writeValue(v))
      .then(() => setTimeout(pump, 25));   // 最多約 40 次/秒
  };
  pump();
}

/* ---------- 搖桿 ---------- */
function levelFromPointer(e) {
  const r = pad.getBoundingClientRect();
  const top = r.top + 32 + 6, travel = r.height - 2 * 32 - 2 * 6;
  const t = Math.min(Math.max((e.clientY - top) / travel, 0), 1);
  return Math.round((1 - t) * 100);
}
function onDrag(e) {
  if (!dragging) return;
  const pct = levelFromPointer(e);
  showLevel(pct);
  showLed(pct > 0, pct);
  sendLevel(pct);
}
pad.addEventListener('pointerdown', e => {
  if (pad.classList.contains('disabled')) return;
  dragging = true;
  pad.setPointerCapture(e.pointerId);
  onDrag(e);
});
pad.addEventListener('pointermove', onDrag);
['pointerup', 'pointercancel'].forEach(t => pad.addEventListener(t, () => { dragging = false; }));

slider.addEventListener('input', () => { dragging = true; showLevel(+slider.value); sendLevel(+slider.value); });
slider.addEventListener('change', () => { dragging = false; });

/* ---------- 連線 ---------- */
async function connect() {
  if (!navigator.bluetooth) { setMsg('此瀏覽器不支援 Web Bluetooth (iPhone 請用 Bluefy)'); return; }
  try {
    setMsg('選擇裝置...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'ESP32-C3' }],
      optionalServices: [SVC],
    });
    device.addEventListener('gattserverdisconnected', () => { setConnected(false); setMsg('已中斷連線'); });

    setMsg('連線中...');
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SVC);
    ctrl   = await service.getCharacteristic(CTRL);
    bright = await service.getCharacteristic(BRIGHT);
    const state = await service.getCharacteristic(STATE);

    state.addEventListener('characteristicvaluechanged', e => onState(e.target.value));
    await state.startNotifications();
    onState(await state.readValue());
    setConnected(true);
  } catch (e) {
    setMsg('錯誤: ' + e.message);
    setConnected(false);
  }
}

$('#connect').onclick = () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
  else connect();
};
cmds.forEach(b => b.onclick = () => gatt(() => ctrl.writeValue(new Uint8Array([+b.dataset.v]))));

showLevel(0);
</script>
</body>
</html>
